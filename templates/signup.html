{% extends "base.html" %}

{% block title %}Sign Up — AutoReel AI{% endblock %}

{% block extra_styles %}
<style>
.auth-container {
    max-width: 420px;
    margin: 4rem auto;
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 0.4rem;
}

.auth-header p {
    color: #a0a0b8;
    font-size: 0.95rem;
}

.auth-footer {
    text-align: center;
    margin-top: 1.2rem;
    font-size: 0.9rem;
    color: #a0a0b8;
}

.auth-footer a {
    color: #8b5cf6;
    text-decoration: none;
    font-weight: 600;
}

.btn-block {
    width: 100%;
    text-align: center;
    padding: 0.85rem;
    font-size: 1rem;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>Create your account</h1>
        <p>Start generating AI reels in minutes</p>
    </div>

    <div class="card">
        <form method="POST" action="{{ url_for('auth.signup') }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="yourname" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 6 characters" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account →</button>
        </form>
    </div>

    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </div>
</div>
{% endblock %}
